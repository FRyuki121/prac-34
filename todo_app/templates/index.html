<!DOCTYPE html>
<html>
<head>
    <title>Список дел</title>

    <style>
        body {
            font-family: Arial;
            margin: 40px;
            background-color: #eeeeee;
        }

        h1 {
            color: blue;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background: white;
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
        }

        a {
            margin-left: 10px;
            color: red;
            text-decoration: none;
        }

        form {
            margin-top: 20px;
        }

        input {
            padding: 8px;
        }

        button {
            padding: 8px 12px;
        }

        .date {
            color: gray;
            font-size: 12px;
        }
    </style>

</head>

<body>

    <h1>Мои задачи</h1>

    <ul>
        {% for task in tasks %}
            <li>

                <strong>{{ task.text }}</strong>
                <br>

                <span class="date">
                    Создано: {{ task.date }}
                </span>

                <br><br>

                <a href="/edit/{{ loop.index0 }}">
                    Редактировать
                </a>

                <a href="/delete/{{ loop.index0 }}">
                    Удалить
                </a>

            </li>
        {% endfor %}
    </ul>

    <h2>Добавить задачу</h2>

    <form method="POST" action="/add">

        <input
            type="text"
            name="task"
            placeholder="Новая задача"
            required
        >

        <button type="submit">
            Добавить
        </button>

    </form>

    <br>

    <a href="/clear">
        Очистить всё
    </a>

</body>
</html>
